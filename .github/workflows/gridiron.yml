name: Gridiron Guru

# Times are UTC. EASTERN STANDARD TIME is in effect (EST = UTC-5) from
# Nov 1 2026 until Mar 2027 -- when DST returns in March, subtract 1 from
# every hour below.
#
# Two things forced this rewrite on 2026-11-03:
#   1. DST ended, so the old UTC crons began firing an hour earlier in ET.
#   2. GitHub's free cron lag has grown: median 4.3 h now, vs 2.7 h in
#      September. On Nov 1 the first Sunday run landed at 1:57 PM EST --
#      after the 1:00 kickoffs.
# So each window is now fed by a wide fan of crons aimed 2-6 h early. The
# script discards the surplus: a scheduled run exits in seconds if the board
# is under 20 min old, and a quiet refresh sends no phone push.
#
# Target landing windows (ET):
#   Sun 11:30 AM - 1:00 PM   early-slate inactives -> kickoff
#   Sun  2:55 PM - 4:25 PM   late slate
#   Sun  6:50 PM - 8:20 PM   SNF
#   Thu/Mon 6:45 - 8:15 PM   TNF / MNF
on:
  schedule:
    # ---- Sunday early slate (target land 11:30 AM - 1:00 PM EST) ----
    - cron: '47 10 * * 0'
    - cron: '17 11 * * 0'
    - cron: '47 11 * * 0'
    - cron: '17 12 * * 0'
    - cron: '47 12 * * 0'
    - cron: '17 13 * * 0'
    # ---- Sunday late slate (target 2:55 - 4:25 PM) ----
    - cron: '47 14 * * 0'
    - cron: '17 15 * * 0'
    - cron: '47 15 * * 0'
    - cron: '17 16 * * 0'
    # ---- Sunday night (target 6:50 - 8:20 PM) ----
    - cron: '17 18 * * 0'
    - cron: '47 18 * * 0'
    - cron: '17 19 * * 0'
    - cron: '47 19 * * 0'
    # ---- Thursday night ----
    - cron: '17 18 * * 4'
    - cron: '47 18 * * 4'
    - cron: '17 19 * * 4'
    - cron: '47 19 * * 4'
    # ---- Monday night ----
    - cron: '17 18 * * 1'
    - cron: '47 18 * * 1'
    - cron: '17 19 * * 1'
    - cron: '47 19 * * 1'
    # ---- Friday final injury designations (target late afternoon) ----
    - cron: '17 17 * * 5'
    - cron: '17 19 * * 5'
    # ---- Wednesday TNF report ----
    - cron: '17 16 * * 3'
    # ---- Tuesday: score the finished week, roll to the next ----
    - cron: '17 11 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gridiron-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gridiron Guru and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python GridironGuru.py

      # The script pushes index.html and the prediction log through the API.
      # The season cache and run-check state are committed here so the next
      # run starts warm.
      - name: Commit refreshed cache
        run: |
          git config user.name  "gridiron-bot"
          git config user.email "gridiron-bot@users.noreply.github.com"
          git add cache/ || true
          if git diff --cached --quiet; then
            echo "cache unchanged"
          else
            git commit -m "Refresh season cache [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
